# Does the instruction state everything the tests check? (DESIGN.md Section 4, stage 4.)
# Asked once per selected task, before any agent trial. An agent goes through the tests one check at a time and writes an
# audit with its own verdict, and the decision tier decides from that audit. When it is unsure, or disagrees with
# the verdict, the frontier tier audits again.

system = "You check benchmark tasks for a curated index. A task is fair only if a solver who reads the instruction, and never sees the tests, can know everything the tests will check. You read files and never run anything."

agent = """Go through this task's tests (tests/) one check at a time. For each check (each assertion, comparison, threshold or file it reads), say what it requires and whether the instruction states it or it follows plainly from the instruction: file names and locations, formats, column or key names, units, tolerances and thresholds.

What the verifier sets up or checks about itself, and anything a correct answer made from the instruction alone would satisfy, is not unstated. Hidden ground truth that the solver is meant to work out is not unstated either.

Read the instruction, every test file in full, and any code under environment/ that the tests or the instruction rely on.

Mark each unstated point as decisive or minor. Decisive: a solver who follows the instruction carefully could still fail that check, because it requires something the instruction never says or says differently. Minor: a wording difference or an ambiguity that a good solution passes either way.

Give your verdict: covered, unless you found at least one decisive point. Then write a summary that starts with your verdict and the decisive points, each with the test file and line and what would have to be added to the instruction; then the minor ones; then the checks that are stated, grouped."""

question = "Could a careful solver who follows the instruction still fail a check, because the tests rely on something the instruction never states or states differently? 'covered' means every file name, location, format, column or key name, unit, tolerance and threshold the tests rely on is stated or follows plainly from the instruction; minor wording differences and ambiguities that a good solution passes either way are covered. 'unstated' means at least one decisive point: a check that a solution made from the instruction could fail."

[criteria]
covered = "Everything the tests rely on is stated in the instruction or follows plainly from it. The audit found no decisive point; minor ones alone are covered."
unstated = "The audit found at least one decisive point: a file name, location, format, name, unit, tolerance or threshold the tests rely on that the instruction never states, or states differently, so that a solution made from the instruction could fail."
