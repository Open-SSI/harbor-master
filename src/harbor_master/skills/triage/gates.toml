# The admission gates a model decides (DESIGN.md Section 4). One entry per gate:
# the question, and what each answer means. A decision model reads the meanings as
# its criteria. Which answers pass is a rule, and lives in curation/gates.py.

[format]
question = "What kind of task is this? 'agentic' means the solver must execute work in an environment: write and run code, use tools, produce files. 'multiple_choice', 'question_answering' and 'short_answer' mean the task is graded on one typed reply."

[format.criteria]
agentic = "The solver must execute work in an environment: write and run code, use tools, produce files or a model."
multiple_choice = "The solver picks one of several listed options."
question_answering = "The solver answers a question in free text, with no work to execute."
short_answer = "The solver gives one short fact, number or name from recall."

[verifier]
question = "How is a submission graded? Read the TEST CODE, not only the file names. 'programmatic' means a script or test suite decides, with no model or person in the loop. 'llm_judge' means a language model grades, even only for answers a script cannot match: code that calls a model API (OpenAI, Anthropic, a chat-completions endpoint) to judge an answer is a model grader. 'rubric' means a person or a rubric grades. 'none' means there is no verifier."

[verifier.criteria]
programmatic = "A script or test suite decides, with no model or person in the loop."
llm_judge = "A language model grades the submission, in whole or for the answers a script cannot match."
rubric = "A person, or a rubric applied by hand, grades the submission."
none = "There is no verifier."

[verifier_cost]
question = "Is grading one submission cheap? 'cheap' means it finishes in a few minutes on a CPU with no paid API and no GPU. Otherwise 'costly'."

[verifier_cost.criteria]
cheap = "Grading one submission finishes in a few minutes on a CPU, with no paid API and no GPU."
costly = "Grading needs a GPU, a paid API, or much more than a few minutes."

[duplicate]
question = "Judging only from this task, is it 'distinct', or does its own text say it is a 'variant' of or the 'same' as another task?"

[duplicate.criteria]
distinct = "Nothing in the task says it copies another task."
variant = "The task's own text says it is a variant of another task."
same = "The task's own text says it is the same as another task."
