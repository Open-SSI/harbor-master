# The curation protocol of this index: every setting that can change a result.
#
# This file is the same for everyone who curates into the index. The owner locks it
# (hm protocol lock), which records its checksum in the ledger. From then on a run whose
# copy differs in any way is refused, and every record carries the checksum it was made
# under. To change a setting, the owner edits this file and locks the new version.
#
# Settings for your own machine (parallelism, budget) are in .hm/hm.toml, and are yours to
# change. No key or token belongs in either file.

[requires]
harbor_master = "0.1.0"         # the oldest Harbor-Master that may run this index. Not part of the checksum

# ----- who decides: the three model tiers -----
# "provider" picks the backend, "model" the model it calls.
# `hm run --simulate` ignores these and spends nothing.
[tiers]
chat = "worker"                 # which tier answers questions typed in the session

[tiers.decision]                # every gate and routing choice: a typed value with a probability
provider = "openrouter"
model = "typesafe/jev-1.14"     # pinned, so that probability thresholds stay stable

[tiers.worker]                  # builds adapters, repairs tasks, audits, writes reports
provider = "claude-agent-sdk"
model = "claude-sonnet-5-5"

[tiers.frontier]                # called only on a trigger: an unsure audit, a failed repair
provider = "claude-agent-sdk"
model = "claude-opus-5-5"

[escalation]
min_confidence = 0.85           # below this, a decision-tier answer goes to the worker tier
frontier_sample = 0.05          # share of settled audits re-judged by the frontier tier

[escalation.gate_min_confidence]
verifier_cost = 0.6             # the verify stage measures the real time, so a wrong "cheap" costs nothing

# ----- admission: which tasks are considered at all -----
[triage]
released_after = "2025-06-01"
require_reference_solution = true
exclude_formats = ["multiple_choice", "question_answering", "short_answer"]
allow_llm_judge_verifier = false
max_verifier_seconds = 300      # CPU only, no paid API

# ----- adapters: for a benchmark that is not in Harbor format -----
[adapt]
max_rounds = 3                  # how many times a model may write the adapter before a person is asked
frontier_after_round = 2        # the worker tier writes rounds 1 and 2, the frontier tier the rest
oracle_tasks = 2                # generated tasks whose reference solution is run through Harbor as a check
require_review = false          # if true, the owner confirms an adapter that passes before it is locked

# ----- selection: which tasks of a benchmark go through the costly stages -----
[select]
top_k = 24                      # at most this many tasks per benchmark
max_fraction = 0.25             # of the benchmark's tasks; the smaller of the two applies
comparisons_per_task = 12       # pairwise comparisons per task, among the tasks near the top
pool_factor = 3                 # every task is scored once; only the best 3 x cap are compared in pairs
stratify = true                 # round-robin over sub-areas
backfill = false                # if true, replace a dropped task with the next ranked one
require_brief = true            # the field lead says what is important before ranking
require_signoff = true          # the lead approves the selection before any trial is spent

[verify]
parity = "sampled"              # "off" | "sampled" | "full"
parity_tasks = 5                # run with the worker tier's model: no separate setting

# ----- difficulty: a task is kept only if frontier agents mostly fail it -----
[difficulty]
trials_per_config = 3
max_pass_rate = 0.4
max_agent_hours = 4.0           # the most one agent trial may run. A task's own limit applies when shorter
early_stop = true

[[difficulty.suite]]
agent = "claude-code"
model = "claude-fable-5-1"
reasoning_effort = "max"
version = "2.1.292"

[[difficulty.suite]]
agent = "codex"
model = "gpt-6-astra"
reasoning_effort = "max"
version = "0.162.1"

[fix]
max_rounds = 3
frontier_after_round = 2

# ----- the index -----
[index]
max_per_benchmark = 8           # accepted tasks one benchmark may have. A ninth must replace one
