# The curation protocol of this index: every setting that can change a result.
#
# This file is the same for everyone who curates into the index. The owner locks it
# (the Lock button on the index's screen), which records its checksum in the ledger. From then on a run whose
# copy differs in any way is refused, and every record carries the checksum it was made
# under. To change a setting, the owner edits this file and locks the new version.
#
# Settings for your own machine (parallelism, claims) are in hm.toml, beside this file, and are yours to
# change. No key or token belongs in either file.

[requires]
harbor_master = "0.1.0"         # the oldest Harbor-Master that may run this index. Not part of the checksum

# ----- who decides: the three model tiers -----
# "provider" picks the backend, "model" the model it calls.
# The worker and frontier tiers run on "claude-agent-sdk" (Claude models) or on "codex" (OpenAI models,
# through Codex). Each takes an API key or a subscription's sign-in, whichever you have. For example:
#   provider = "codex"
#   model = "gpt-5.6-terra"
# `hm curate --demo` ignores these and spends nothing.
[tiers]
chat = "worker"                 # which tier answers questions typed in the session

[tiers.decision]                # every gate and routing choice: a typed value with a probability. Jev only
provider = "openrouter"
model = "typesafe/jev-1.14"     # pinned, so that probability thresholds stay stable

[tiers.worker]                  # builds adapters, repairs tasks, audits, writes reports
provider = "claude-agent-sdk"
model = "claude-sonnet-5-5"

[tiers.frontier]                # called only on a trigger: an unsure audit, a failed repair
provider = "claude-agent-sdk"
model = "claude-opus-5-5"

[escalation]
min_confidence = 0.85           # below this, a decision-tier answer goes to the worker tier

[escalation.gate_min_confidence]
verifier_cost = 0.6             # a less sure "cheap" is accepted: a verifier over max_verifier_seconds still fails its trials

# ----- admission: which tasks are considered at all -----
[triage]
released_after = "2025-06-01"
require_reference_solution = true   # a task with none must be passed by a frontier trial, whose work becomes its solution; off, it is dropped
exclude_formats = ["multiple_choice", "question_answering", "short_answer"]
allow_llm_judge_verifier = false
max_verifier_seconds = 300      # CPU only, no paid API. A verifier that takes longer fails, and its task is dropped
max_build_seconds = 600         # building a task's environment. One that takes longer fails, and its task is dropped
max_verify_minutes = 30.0       # a reference solution run by the adapter check. One that takes longer fails the check
max_reported_pass_rate = 0.4    # an agent reads the benchmark's own published results. A task that a model already
                                # solves more often than this is dropped. A task with no reported result passes. 1.0 turns this off

# ----- adapters: for a benchmark that is not in Harbor format -----
[adapt]
max_rounds = 2                  # rounds of writing the adapter in all: round 1 by the worker model, round 2 by the frontier model
frontier_after_round = 1        # the worker tier writes round 1, the frontier tier the rest
oracle_tasks = 3                # generated tasks whose reference solution is run through Harbor as a check
require_review = false          # if true, a person confirms an adapter that passes before it is used

# ----- selection: which tasks of a benchmark go through the costly stages -----
[select]
top_k = 24                      # at most this many tasks per benchmark
max_fraction = 0.25             # of the benchmark's tasks; the smaller of the two applies
comparisons_per_task = 12       # pairwise comparisons per task, among the tasks near the top
pool_factor = 3                 # every task is scored once; only the best 3 x cap are compared in pairs
stratify = true                 # round-robin over sub-areas
require_brief = true            # the lead says what is important before ranking
require_signoff = true          # the lead approves the selection before any trial is spent

# ----- difficulty: a task is kept only if frontier agents mostly fail it -----
# Run once per task, after every cheap check has passed. A later repair does not run it again.
[difficulty]
max_pass_rate = 0.5             # kept when at most half the frontier trials pass: 0 to 3 of 6
trials = 3                      # tries per task by each agent of the suite
max_agent_hours = 4.0           # the most one agent trial may run. A task's own limit applies when shorter
early_stop = true
cheap_solve = true              # the worker tier's model tries first. A task it solves every time is dropped with no frontier trial
cheap_trials = 2                # its tries, run side by side. The task is dropped only if all of them pass
cheap_agent = "claude-code"     # the agent that model runs in
cheap_agent_hours = 1.0         # the most that one of them may run

[[difficulty.suite]]
agent = "claude-code"
model = "claude-fable-5-1"
reasoning_effort = "max"
version = "2.1.292"

[[difficulty.suite]]
agent = "codex"
model = "gpt-6-astra"
reasoning_effort = "max"
version = "0.162.1"

[fix]
max_rounds = 2                  # round 1 by the worker model, round 2 by the frontier model
frontier_after_round = 1
