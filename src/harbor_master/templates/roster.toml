# The agent configurations to benchmark on this index. Each one is run on every accepted
# task, and the leaderboard has one row per entry.
#
# The short way: name a preset: claude-opus-5.5, claude-sonnet-5.5, claude-haiku-4.5, gpt-6-astra,
# gpt-5.6-terra, gpt-5.6-luna, muse-wonder, glm-5.3-flash, qwen3.8-27b or minimax-m3.
#
# [[config]]
# use = "claude-opus-5.5"
#
# A field written beside `use` replaces the preset's. Pin the agent's version this way, so
# that results can be repeated:
#
# [[config]]
# use = "claude-opus-5.5"
# version = "2.1.292"
#
# Or write a configuration out in full, with any agent Harbor has:
#
#   name      what the leaderboard calls it, and what `hm eval --config NAME` takes
#   agent     the Harbor agent
#   model     the model, as that agent names it
#   key       the variable in secrets.env that this configuration needs
#   env       settings passed to the agent. Never a key: name one as "${VARIABLE}"
#
# [[config]]
# name = "my-agent"
# agent = "mini-swe-agent"
# model = "openrouter/qwen/qwen3.8-27b"
# key = "OPENROUTER_API_KEY"
#
# Only the owner changes this file, at any time, before the release and after it: a new
# configuration adds its cells to the to-do list. It is not locked. Share a change with: hm sync
