# How this machine runs this index. Each person's own copy is hm.toml, beside this file: hm clone
# makes it from hm.example.toml, and git ignores it. Change hm.toml freely, at any time. Nothing
# in it changes a result, so it is not part of the protocol, which is in protocol.toml.
#
# No key or token belongs here. Keys go in secrets.env, beside this file, which git ignores too.

[run]
cells = 4                       # tasks in flight, one agent session each
max_containers = 16
sandbox = "docker"              # "docker" | "daytona" | "modal". "none" runs an adapter's code on this machine as it is
claim_hours = 12.0              # how long a claim on a benchmark holds. A run that goes on renews it
watch_minutes = 3.0             # how often a running trial's logs are looked at
quiet_minutes = 9.0             # logs still for this long: the worker agent reads them, and a hung trial is stopped
agent_setup_minutes = 30.0      # installing an agent in a task's container, before it runs: Harbor's own limit is 6
