# Agent configurations with a short name: one Harbor agent, one model, and the settings they were run with.
#
# An index names one in the difficulty suite of its protocol.toml:
#
#   [[config]]
#   use = "claude-opus-5.5"
#
# Any field written beside `use` replaces the preset's. A configuration that is not here is written out in
# full. The agent is Claude Code (Claude models) or Codex (OpenAI models): each takes an API key or a
# subscription, whichever is set (see an index's secrets.env.example).
#   version   the agent's own version, where it was pinned. Empty means the newest at run time,
#             so an index that wants repeatable results sets it beside `use`
#   env       settings passed to the agent. Never a key
# No key belongs in this file.

[preset."claude-opus-5.5"]
agent = "claude-code"
model = "claude-opus-5-5"
reasoning_effort = "max"
env = { CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000" }

[preset."claude-sonnet-5.5"]
agent = "claude-code"
model = "claude-sonnet-5-5"
reasoning_effort = "high"

[preset."claude-haiku-4.5"]
agent = "claude-code"
model = "claude-haiku-4-5-20251001"

[preset."gpt-6-astra"]
agent = "codex"
model = "gpt-6-astra"
reasoning_effort = "max"
version = "0.162.1"             # older Codex builds refuse this model, or quietly ignore "max"

[preset."gpt-5.6-terra"]
agent = "codex"
model = "gpt-5.6-terra"
reasoning_effort = "max"
version = "0.162.1"

[preset."gpt-5.6-luna"]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"
version = "0.162.1"
