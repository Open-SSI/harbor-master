[project]
name = "harbor-master"
version = "0.1.0"
description = "A multi-agent system that curates benchmarks into an index of hard, verified tasks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "pydantic>=2.6",
    "cryptography>=42",
    "tomli-w>=1.0",
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]      # only for an index that keeps its accepted tasks on Hugging Face

[project.scripts]
hm = "harbor_master.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_master"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
