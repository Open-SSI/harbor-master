# Your settings for this workspace: how this machine runs.
# Change these freely, at any time. They do not change a result, so they are not part
# of the locked protocol, which is in protocol.toml. Git ignores this folder.
#
# No key or token belongs in this file. Keys are read from the environment, or from
# secrets.env in the Harbor-Master repository folder, which git ignores.

[run]
cells = 4                       # tasks in flight, one agent session each
max_containers = 16
sandbox = "docker"              # "docker" | "daytona" | "modal". "none" runs an adapter's code on this machine as it is
claim_hours = 12.0              # how long a claim on a benchmark holds. A run that goes on renews it
watch_minutes = 3.0             # how often a running trial's logs are looked at
quiet_minutes = 9.0             # logs still for this long: the worker agent reads them, and a hung trial is stopped
